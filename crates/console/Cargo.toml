[package]
name = "survive-console"
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yew = { version = "0.23", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "Element", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "Event", "InputEvent", "MouseEvent", "KeyboardEvent", "WheelEvent", "PointerEvent", "HtmlElement", "HtmlDialogElement", "NodeList", "Node", "AbortController", "AbortSignal", "ReadableStreamDefaultReader", "HtmlIFrameElement", "RequestMode", "RequestCredentials", "RequestRedirect", "RequestCache", "ReferrerPolicy"] }
js-sys = "0.3"
gloo-net = "0.7"
gloo-timers = "0.3"
serde_json = "1"
base64 = "0.22"
kuchiki = "0.8"
regex = { version = "1", default-features = false, features = ["std", "perf"] }
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
survive-core = { path = "../core" }
tempfile = "3"
